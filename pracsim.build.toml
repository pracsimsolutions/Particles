[product]
name           = "Particles"
display_name   = "PracSim Particles"
description    = "PracSim Particles — visual particle emitters (smoke, steam, dust, sparks, spray, fountains) for FlexSim. Drawn analytically at draw time, so they add zero events to the simulation."
url            = "https://github.com/pracsimsolutions/Particles"
# Free module: no licensing.

[wix]
# FIXED FOREVER. Changing either GUID breaks MSI in-place upgrades.
upgrade_code         = "ED2E1BA4-5342-423E-9858-3C7F251C1182"
component_guid_prefix = "15A43ED4-0F13-456E-8648-6190D3F14"

# Installer artwork. The names below are resolved against the maintainers'
# brand asset folder when an installer is built; they are not files in this
# repo, and they are not needed to build or run the module itself.
[brand]
icon_svg     = "particles.svg"
banner_svg   = "installer/particles-banner.svg"
dialog_svg   = "installer/particles-dialog.svg"
toolbox_png  = "bitmaps/particles.png"

[payload]
# What an installer ships. APPEND ONLY.
files = [
    "Particles.t",
    "Particles.dll",
    "LICENSE.txt",
]
# Recursively included. Runtime references:
#   bitmaps/soft_dot.png       -> loaded by ParticleSystem.cpp (Points style)
#   bitmaps/*.png              -> library/preset icons from Particles.fsx
# NOTE: the toolbox PNG is staged automatically from [brand].toolbox_png --
# do NOT add it to files above.
subdirs = ["bitmaps"]
